<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet" />
<style>
  /* Mirrors the tokens in src/index.css so the card reads as the same product. */
  :root {
    --bg-deep: #0c0c0e;
    --bg-panel: #151517;
    --primary: #e63946;
    --accent: #34d399;
    --txt: #f2f2f3;
    --txt-dim: #a3a3ad;
    --txt-faint: #8e8e98;
    --border-light: rgba(255, 255, 255, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
    background: var(--bg-deep);
    /* Same 32px grid the app paints on its body. */
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--txt);
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Red wash from the top-left, echoing .app-header's gradients. */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(230,57,70,.16) 0%, transparent 62%),
      radial-gradient(700px 460px at 96% 108%, rgba(230,57,70,.10) 0%, transparent 60%);
  }

  /* The 2px primary rule .app-header wears along its top edge. */
  body::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--primary) 0%, rgba(230,57,70,.28) 52%, transparent 100%);
  }

  .inner { position: relative; z-index: 1; }

  .brand {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 34px;
  }

  .mark {
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    border: 2px solid rgba(230,57,70,.42);
    border-radius: 18px;
    background: rgba(230,57,70,.12);
    color: var(--primary);
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -.02em;
  }

  h1 {
    font-size: 60px;
    font-weight: 800;
    letter-spacing: .01em;
    line-height: 1;
  }
  h1 span { color: var(--primary); }

  .tagline {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.32;
    letter-spacing: -.01em;
    margin-bottom: 20px;
  }

  .sub {
    font-size: 25px;
    font-weight: 500;
    color: var(--txt-dim);
    margin-bottom: 52px;
  }

  .features {
    display: flex;
    gap: 13px;
    margin-bottom: 54px;
  }

  .chip {
    padding: 13px 24px;
    border: 1px solid var(--border-light);
    border-radius: 11px;
    background: var(--bg-panel);
    color: var(--txt-dim);
    font-size: 23px;
    font-weight: 600;
  }

  .foot {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 25px;
    font-weight: 700;
    color: var(--txt-faint);
    letter-spacing: .02em;
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--accent);
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px rgba(52,211,153,.85);
  }
  .sep { color: rgba(255,255,255,.16); }
</style>
</head>
<body>
  <div class="inner">
    <div class="brand">
      <div class="mark">T2</div>
      <h1>TAG<span>2</span>NOW</h1>
    </div>

    <p class="tagline">철권 태그 토너먼트 2<br />실시간 대전 정보</p>
    <p class="sub">지금 열려 있는 방, 랭킹, 플레이어 활동을 한눈에</p>

    <div class="features">
      <span class="chip">실시간 방 목록</span>
      <span class="chip">리더보드</span>
      <span class="chip">예약 매치</span>
      <span class="chip">커뮤니티</span>
    </div>

    <div class="foot">
      <span class="live"><span class="dot"></span>LIVE</span>
      <span class="sep">/</span>
      <span>tag2now.click</span>
    </div>
  </div>
</body>
</html>
