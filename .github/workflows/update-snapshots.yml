name: Update Visual Baselines

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # e2e/visual holds the only toHaveScreenshot calls; e2e/specs has no
      # baselines to regenerate, so running it here is 136 tests of nothing.
      - run: npx playwright test e2e/visual --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: updated-snapshots
          path: e2e/**/*-snapshots/**
          retention-days: 30
