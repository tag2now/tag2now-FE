name: Test

on:
  workflow_call:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # contract.test.ts only proves we agree with the copy in src/config; this
      # proves the copy is still what tag2now-BE publishes. Without it a backend
      # rename leaves both repositories green and breaks production instead.
      - name: Check the vendored API contract is current
        run: |
          curl -sSfo /tmp/openapi.json https://raw.githubusercontent.com/tag2now/tag2now-BE/master/openapi.json
          if diff -u src/config/openapi.json /tmp/openapi.json; then exit 0; fi
          echo "::error::src/config/openapi.json is behind tag2now-BE. Copy the published file over it and update src/config/contract.test.ts to match the diff above."
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 비주얼 회귀(e2e/visual)는 커밋된 리눅스 baseline이 없어 CI에서 제외한다.
      - run: npx playwright test e2e/specs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
