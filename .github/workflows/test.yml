name: Test

on:
  workflow_call:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 전체를 돌린다. 스냅샷 비교는 더 이상 없고, 남은 e2e/visual/tokens.spec.ts는
      # baseline 파일 없이 브라우저가 계산한 색을 직접 비교하므로 CI에서도 동작한다.
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
